# pyproject.toml - Python's own file for mindmap-ai.
#
# It pins the toolchain. `recipe.ps1 test` runs pytest, mypy, ruff check and ruff
# format, and every setting those four read is here. There are no task-runner
# sections: the recipe's verbs are the tasks.

[build-system]
# Pinned with a version, not a bare name: an unpinned backend changes what
# `recipe.ps1 build` produces without anyone editing this file.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmap-ai"
# This must equal $Version in recipe.ps1: `recipe.ps1 test` fails when they disagree.
version = "1.1.0"
description = "Telegram bot that turns a written plan into a mind-map picture and answers questions through the Gemini CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
# The four packages requirements.txt named, unpinned there; uv.lock pins them.
dependencies = [
    "python-dotenv>=1.0",
    "python-telegram-bot[job-queue]>=20.0",
    "graphviz>=0.20",
    "httpx>=0.27",
]

[project.scripts]
mindmap-ai = "bot:run_forever"

[dependency-groups]
# `uv run` installs this group by default, so test.yaml's Runner health step finds
# ruff, pytest and mypy through `uv run --frozen <tool> --version`.
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "coverage==7.15.2",
]

[tool.setuptools]
# One module, in app/.
package-dir = { "" = "app" }
py-modules = ["bot"]

[tool.uv]
# The tests and `recipe.ps1 run` use the source tree, so uv does not install the project.
package = false

[tool.ruff]
# Ruff refuses to run at all when its own version is not this one.
required-version = "0.16.1"
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
# Section 7 prints these files verbatim, so the formatter must not touch them.
exclude = [".claude/**", "tests/manual/serve.py", "tools/wiki.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# The module sits in app/, so app/ goes on sys.path however pytest is started.
pythonpath = ["app"]
# Measured on adoption: 220 of 226 statements, 97.3%. The floor is the whole number below.
# The six missed are the `__main__` block and the parse guard around plain string splitting.
addopts = "-q --cov=bot --cov-report=term --cov-fail-under=97"

[tool.mypy]
python_version = "3.13"
files = ["app/bot.py", "tools"]

# THE SILENCE LIST, measured on adoption: it only ever gets shorter (R-12).
# 1 name, third-party: graphviz ships no py.typed marker at the pinned version.
# None of this repository's own code is silenced.
[[tool.mypy.overrides]]
module = ["graphviz.*"]
ignore_missing_imports = true
